<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>創作者頁自訂 · 開發預覽</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{font:16px system-ui;margin:0;color:#142641;background:#f7f9fc}main{max-width:1100px;margin:48px auto;padding:24px}h1{font-family:serif}p{line-height:1.8;color:#65738a}.layout{display:grid;grid-template-columns:340px 1fr;gap:40px}label{display:block;margin:20px 0 8px}input,textarea{width:100%;padding:12px;border:1px solid #dbe3ef;border-radius:8px;font:inherit;background:white}article{border:1px solid #dbe3ef;border-radius:20px;background:white;overflow:hidden;align-self:start}.banner{height:190px;background:linear-gradient(120deg,#dce8f9,#aec7e8);background-size:cover;background-position:center}.body{padding:24px}.avatar{width:82px;height:82px;border-radius:50%;background:#edf3ff;object-fit:cover;margin-top:-62px;border:4px solid white;display:grid;place-items:center;font-size:30px;color:#1647dd}.note{padding:12px;border-left:3px solid #1647dd}.body p{white-space:pre-wrap}#error{color:#a02727}button{margin-top:24px;padding:12px 18px;border:0;border-radius:8px;background:#e8efff;color:#1647dd}@media(max-width:750px){.layout{grid-template-columns:1fr}main{margin:12px auto}}
</style><main><p>下一階段 · 本機互動原型</p><h1>讓你的口袋世界，有自己的樣子。</h1><p class="note">這是編輯體驗預覽，修改與圖片只留在本頁，不會上傳或儲存。登入與正式儲存尚未開放。</p><div class="layout"><form id="form"><label for="name">顯示姓名</label><input id="name" maxlength="60" value="William"><label for="bio">個人簡介</label><textarea id="bio" rows="4" maxlength="500">一點收集，一點分享，下一站見。</textarea><label for="avatar">頭像（JPG／PNG／WebP，最多 2 MB）</label><input id="avatar" type="file" accept="image/jpeg,image/png,image/webp"><label for="banner">Banner（最多 5 MB，建議橫幅）</label><input id="banner" type="file" accept="image/jpeg,image/png,image/webp"><p id="error" role="status"></p><button type="reset">重設預覽</button></form><article aria-label="個人頁預覽"><div class="banner" id="preview-banner"></div><div class="body"><div id="initial" class="avatar">W</div><img id="preview-avatar" class="avatar" hidden alt="頭像預覽"><h2 id="preview-name">William</h2><p id="preview-bio">一點收集，一點分享，下一站見。</p><hr><p>你的公開清單將顯示在這裡。</p></div></article></div></main><script>
const $=id=>document.getElementById(id),urls={};$('form').onsubmit=e=>e.preventDefault();for(const [id,target]of [['name','preview-name'],['bio','preview-bio']])$(id).oninput=()=>{$(target).textContent=$(id).value;$('initial').textContent=$('name').value.slice(0,1)||'·'};
for(const id of ['avatar','banner'])$(id).onchange=async()=>{const file=$(id).files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>(id==='avatar'?2:5)*1024*1024){$('error').textContent='請選擇符合格式與大小的圖片';return;}try{const bitmap=await createImageBitmap(file);bitmap.close();}catch{$('error').textContent='圖片無法讀取';return;}$('error').textContent='';if(urls[id])URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(file);if(id==='avatar'){$('preview-avatar').src=urls[id];$('preview-avatar').hidden=false;$('initial').hidden=true;}else $('preview-banner').style.backgroundImage=`url("${urls[id]}")`;};$('form').onreset=()=>{for(const url of Object.values(urls))URL.revokeObjectURL(url);$('preview-avatar').hidden=true;$('initial').hidden=false;$('preview-banner').style.backgroundImage='';$('preview-name').textContent='William';$('preview-bio').textContent='一點收集，一點分享，下一站見。';$('initial').textContent='W';$('error').textContent='';};
</script></html>
