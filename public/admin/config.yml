backend:
  name: github
  repo: R3dra1n/GoogleMapList
  branch: main
  base_url: https://r3dra1n.github.io
  auth_endpoint: auth
  commit_messages:
    create: 'content: 新增 {{collection}} {{slug}}'
    update: 'content: 更新 {{collection}} {{slug}}'
    delete: 'content: 刪除 {{collection}} {{slug}}'
locale: zh_Hant
site_url: https://r3dra1n.github.io/GoogleMapList/
display_url: https://r3dra1n.github.io/GoogleMapList/
media_folder: public/uploads
public_folder: uploads
publish_mode: simple
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: continents
    label: 大洲
    label_singular: 大洲
    folder: content/continents
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: name
    slug: '{{id}}'
    summary: '{{name}} · 排序 {{order}}'
    sortable_fields: [order, name]
    editor: { preview: false }
    fields:
      - { name: id, label: 固定識別碼, widget: stable-id }
      - { name: name, label: 大洲名稱, widget: string }
      - { name: english, label: 英文名稱, widget: string, required: false }
      - { name: order, label: 顯示順序, widget: number, value_type: int, default: 10, min: 0 }
      - { name: published, label: 公開顯示, widget: boolean, default: true, hint: '關閉後，所屬國家和城市會一起隱藏；資料仍然保留。' }
  - name: countries
    label: 國家／地區
    label_singular: 國家／地區
    folder: content/countries
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: name
    slug: '{{id}}'
    summary: '{{name}} · 排序 {{order}}'
    sortable_fields: [order, name]
    editor: { preview: false }
    fields:
      - { name: id, label: 固定識別碼, widget: stable-id }
      - { name: name, label: 名稱, widget: string }
      - { name: english, label: 英文名稱, widget: string, required: false }
      - { name: continent, label: 所屬大洲, widget: relation, collection: continents, search_fields: [name], value_field: id, display_fields: [name] }
      - { name: description, label: 簡短介紹, widget: text, required: false }
      - { name: image, label: 封面照片, widget: image, required: false, choose_url: false, hint: '請上傳有權使用的 JPG、PNG、WebP 或 GIF。沒有照片時使用預設封面。' }
      - { name: imageAlt, label: 圖片描述, widget: string, required: false, hint: '有封面照片時必填，供無法看見圖片的人理解內容。' }
      - { name: imageCredit, label: 攝影者與授權, widget: string, required: false, hint: '使用他人照片時填寫署名與授權；自有照片可填自己的名字。' }
      - { name: imageSource, label: 原圖來源網址, widget: string, required: false }
      - { name: imageLicense, label: 授權條款網址, widget: string, required: false }
      - { name: order, label: 顯示順序, widget: number, value_type: int, default: 10, min: 0 }
      - { name: published, label: 公開顯示, widget: boolean, default: true, hint: '關閉後，所屬城市也會隱藏。若要移除區域，請使用此開關。' }
  - name: cities
    label: 城市／縣市清單
    label_singular: 城市／縣市
    folder: content/cities
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    slug: '{{id}}'
    summary: '{{name}} · 排序 {{order}}'
    sortable_fields: [order, name]
    editor: { preview: false }
    fields:
      - { name: id, label: 固定識別碼, widget: stable-id }
      - { name: name, label: 城市／縣市名稱, widget: string }
      - { name: english, label: 英文名稱, widget: string, required: false }
      - { name: country, label: 所屬國家／地區, widget: relation, collection: countries, search_fields: [name], value_field: id, display_fields: [name], hint: '大洲會自動沿用所選國家／地區。' }
      - { name: description, label: 簡短介紹, widget: text, required: false }
      - { name: food, label: 美食清單連結, widget: string, required: false, hint: '貼上 Google Maps 分享連結。留空會顯示「整理中」。' }
      - { name: sights, label: 景點清單連結, widget: string, required: false, hint: '可以與美食共用同一個連結，前台會標示綜合清單。' }
      - { name: image, label: 封面照片, widget: image, required: false, choose_url: false, hint: '上傳有權使用的 JPG、PNG、WebP 或 GIF；留空使用預設封面。' }
      - { name: imageAlt, label: 圖片描述, widget: string, required: false }
      - { name: imageCredit, label: 攝影者與授權, widget: string, required: false }
      - { name: imageSource, label: 原圖來源網址, widget: string, required: false }
      - { name: imageLicense, label: 授權條款網址, widget: string, required: false }
      - { name: order, label: 顯示順序, widget: number, value_type: int, default: 10, min: 0 }
      - { name: published, label: 公開顯示, widget: boolean, default: true, hint: '關閉即可暫時下架，不用刪除清單。' }
