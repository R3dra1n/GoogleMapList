backend:
  name: github
  repo: R3dra1n/GoogleMapList
  branch: main
  base_url: https://pocket-atlas-auth.huayang-hsu.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: 'content: 新增 {{collection}} {{slug}}'
    update: 'content: 更新 {{collection}} {{slug}}'
    delete: 'content: 刪除 {{collection}} {{slug}}'
locale: zh_Hant
site_url: https://r3dra1n.github.io/GoogleMapList/
display_url: https://r3dra1n.github.io/GoogleMapList/
media_folder: public/uploads
public_folder: uploads
publish_mode: simple
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: continents
    label: 大洲
    label_singular: 大洲
    folder: content/continents
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: name
    slug: '{{id}}'
    summary: '{{name}} · 排序 {{order}}'
    sortable_fields: [order, name]
    editor: { preview: false }
    fields:
      - { name: id, label: 固定識別碼, widget: stable-id }
      - { name: name, label: 大洲名稱, widget: string }
      - { name: english, label: 英文名稱, widget: string, required: false, default: '' }
      - { name: nameHans, label: 简体中文名稱, widget: string, required: false, default: '' }
      - { name: nameJa, label: 名稱（日本語）, widget: string, required: false, default: '' }
      - { name: nameKo, label: 名稱（한국어）, widget: string, required: false, default: '' }
      - { name: order, label: 顯示順序, widget: number, value_type: int, default: 10, min: 0 }
      - { name: published, label: 公開顯示, widget: boolean, default: true, hint: '關閉後，所屬國家和城市會一起隱藏；資料仍然保留。' }
  - name: countries
    label: 國家／地區
    label_singular: 國家／地區
    folder: content/countries
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: name
    slug: '{{id}}'
    summary: '{{name}} · 排序 {{order}}'
    sortable_fields: [order, name]
    editor: { preview: false }
    fields:
      - { name: originalAuthor, label: 原清單作者（非本站收錄者）, widget: string, required: false }
      - { name: originalAuthorSource, label: 原清單作者來源網址, widget: string, required: false }
      - { name: owner, label: 整理者, widget: relation, collection: creators, search_fields: [name], value_field: id, display_fields: [name], required: false, default: william }
      - { name: sources, label: 來源創作者, widget: relation, collection: creators, search_fields: [name], value_field: id, display_fields: [name], multiple: true, required: false }
      - { name: destinations, label: 地名標籤：國家／地區, widget: relation, collection: countries, search_fields: [name], value_field: id, display_fields: [name], multiple: true, required: false }
      - { name: locationNames, label: 地名標籤：補充地名, widget: list, required: false, hint: '例如墾丁、可愛島；未建立國家／城市資料時也可填寫，點選可篩選同地名清單。' }
      - { name: tags, label: 類別標籤, widget: list, required: false }
      - { name: keywords, label: 搜尋關鍵字與別名, widget: list, required: false }
      - name: videos
        label: YouTube 原影片（上下排列）
        widget: list
        required: false
        fields:
          - { name: url, label: YouTube 網址, widget: string }
          - { name: title, label: 影片標題, widget: string, required: false }
          - { name: start, label: 起播秒數, widget: number, value_type: int, min: 0, default: 0 }
      - name: places
        label: 已確認收錄的景點
        widget: list
        required: false
        fields:
          - { name: name, label: 景點名稱, widget: string }
          - { name: keywords, label: 搜尋別名, widget: list, required: false }
          - { name: url, label: 地圖網址, widget: string, required: false }
          - { name: source, label: 資料來源網址, widget: string, required: false }
          - { name: note, label: 備註, widget: text, required: false }
      - { name: id, label: 固定識別碼, widget: stable-id }
      - { name: name, label: 名稱, widget: string }
      - { name: english, label: 英文名稱, widget: string, required: false, default: '' }
      - { name: nameHans, label: 简体中文名稱, widget: string, required: false, default: '' }
      - { name: nameJa, label: 名稱（日本語）, widget: string, required: false, default: '' }
      - { name: nameKo, label: 名稱（한국어）, widget: string, required: false, default: '' }
      - { name: continent, label: 所屬大洲, widget: parent-relation, collection: continents, search_fields: [name], value_field: id, display_fields: [name] }
      - { name: standalone, label: 不分城市，直接使用地區清單, widget: boolean, default: false, required: false, hint: '適用香港、澳門等。開啟後不必建立下級城市，即可顯示在首頁。' }
      - { name: amap, label: 高德地圖分享連結, widget: string, required: false, default: '', hint: '貼上高德的 HTTPS 分享連結；不會自動轉換 Google 清單。' }
      - { name: baidu, label: 百度地圖分享連結, widget: string, required: false, default: '', hint: '貼上百度地圖的 HTTPS 分享連結。' }
      - { name: food, label: 地區美食清單, widget: string, required: false, default: '' }
      - { name: sights, label: 地區景點清單, widget: string, required: false, default: '' }
      - { name: myMap, label: 地區 Google 我的地圖, widget: string, required: false, default: '' }
      - { name: autoDescription, label: 簡介留空時由 AI 自動產生, widget: boolean, required: false, default: true, hint: '發布時產生並保存繁體中文簡介，再自動翻譯。已有文字不會覆蓋；生成後可重新開啟修改。' }
      - { name: descriptionSource, label: 簡介來源網址, widget: string, required: false }
      - { name: descriptionImportedAt, widget: hidden, required: false }
      - { name: descriptionImportMethod, widget: hidden, required: false }
      - { name: description, label: 簡短介紹, widget: text, required: false, default: '' }
      - { name: descriptionHans, label: 简体中文介紹, widget: text, required: false, default: '' }
      - { name: descriptionJa, label: 介紹（日本語）, widget: text, required: false, default: '' }
      - { name: descriptionKo, label: 介紹（한국어）, widget: text, required: false, default: '' }
      - { name: descriptionEn, label: English introduction, widget: text, required: false, default: '' }
      - { name: image, label: 封面照片, widget: image, required: false, default: '', choose_url: false, hint: '請上傳有權使用的 JPG、PNG、WebP 或 GIF。沒有照片時使用預設封面；儲存後可用上方「推薦收件箱／搜圖」自動搜尋候選。' }
      - { name: imageAlt, label: 圖片描述, widget: string, required: false, default: '', hint: '有封面照片時必填，供無法看見圖片的人理解內容。' }
      - { name: imageAltHans, label: 图片描述（简体中文）, widget: string, required: false, default: '' }
      - { name: imageAltJa, label: 圖片描述（日本語）, widget: string, required: false, default: '' }
      - { name: imageAltKo, label: 圖片描述（한국어）, widget: string, required: false, default: '' }
      - { name: imageAltEn, label: Image description (English), widget: string, required: false, default: '' }
      - { name: imageCredit, label: 攝影者與授權, widget: string, required: false, default: '', hint: '使用他人照片時填寫署名與授權；自有照片可填自己的名字。' }
      - { name: imageSource, label: 原圖來源網址, widget: string, required: false, default: '' }
      - { name: imageLicense, label: 授權條款網址, widget: string, required: false, default: '' }
      - { name: order, label: 顯示順序, widget: number, value_type: int, default: 10, min: 0 }
      - { name: published, label: 公開顯示, widget: boolean, default: true, hint: '關閉後，所屬城市也會隱藏。若要移除區域，請使用此開關。' }
  - name: cities
    label: 城市／縣市清單
    label_singular: 城市／縣市
    folder: content/cities
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    slug: '{{id}}'
    summary: '{{name}} · 排序 {{order}}'
    sortable_fields: [order, name]
    editor: { preview: false }
    fields:
      - { name: originalAuthor, label: 原清單作者（非本站收錄者）, widget: string, required: false }
      - { name: originalAuthorSource, label: 原清單作者來源網址, widget: string, required: false }
      - { name: owner, label: 整理者, widget: relation, collection: creators, search_fields: [name], value_field: id, display_fields: [name], required: false, default: william }
      - { name: sources, label: 來源創作者, widget: relation, collection: creators, search_fields: [name], value_field: id, display_fields: [name], multiple: true, required: false }
      - { name: destinations, label: 地名標籤：國家／地區, widget: relation, collection: countries, search_fields: [name], value_field: id, display_fields: [name], multiple: true, required: false }
      - { name: locationNames, label: 地名標籤：補充地名, widget: list, required: false, hint: '例如墾丁、可愛島；未建立國家／城市資料時也可填寫，點選可篩選同地名清單。' }
      - { name: tags, label: 類別標籤, widget: list, required: false }
      - { name: keywords, label: 搜尋關鍵字與別名, widget: list, required: false }
      - name: videos
        label: YouTube 原影片（上下排列）
        widget: list
        required: false
        fields:
          - { name: url, label: YouTube 網址, widget: string }
          - { name: title, label: 影片標題, widget: string, required: false }
          - { name: start, label: 起播秒數, widget: number, value_type: int, min: 0, default: 0 }
      - name: places
        label: 已確認收錄的景點
        widget: list
        required: false
        fields:
          - { name: name, label: 景點名稱, widget: string }
          - { name: keywords, label: 搜尋別名, widget: list, required: false }
          - { name: url, label: 地圖網址, widget: string, required: false }
          - { name: source, label: 資料來源網址, widget: string, required: false }
          - { name: note, label: 備註, widget: text, required: false }
      - { name: id, label: 固定識別碼, widget: stable-id }
      - { name: name, label: 城市／縣市名稱, widget: string }
      - { name: english, label: 英文名稱, widget: string, required: false, default: '' }
      - { name: nameHans, label: 简体中文名稱, widget: string, required: false, default: '' }
      - { name: nameJa, label: 名稱（日本語）, widget: string, required: false, default: '' }
      - { name: nameKo, label: 名稱（한국어）, widget: string, required: false, default: '' }
      - { name: country, label: 所屬國家／地區, widget: parent-relation, collection: countries, search_fields: [name], value_field: id, display_fields: [name], hint: '大洲會自動沿用所選國家／地區。' }
      - { name: autoDescription, label: 簡介留空時由 AI 自動產生, widget: boolean, required: false, default: true, hint: '發布時產生並保存繁體中文簡介，再自動翻譯。已有文字不會覆蓋；生成後可重新開啟修改。' }
      - { name: descriptionSource, label: 簡介來源網址, widget: string, required: false }
      - { name: descriptionImportedAt, widget: hidden, required: false }
      - { name: descriptionImportMethod, widget: hidden, required: false }
      - { name: description, label: 簡短介紹, widget: text, required: false, default: '' }
      - { name: descriptionHans, label: 简体中文介紹, widget: text, required: false, default: '' }
      - { name: descriptionJa, label: 介紹（日本語）, widget: text, required: false, default: '' }
      - { name: descriptionKo, label: 介紹（한국어）, widget: text, required: false, default: '' }
      - { name: descriptionEn, label: English introduction, widget: text, required: false, default: '' }
      - { name: amap, label: 高德地圖分享連結, widget: string, required: false, default: '', hint: '貼上高德的 HTTPS 分享連結；不會自動轉換 Google 清單。' }
      - { name: baidu, label: 百度地圖分享連結, widget: string, required: false, default: '', hint: '貼上百度地圖的 HTTPS 分享連結。' }
      - { name: food, label: 美食清單連結, widget: string, required: false, default: '', hint: '貼上 Google Maps 分享連結。留空會顯示「整理中」。' }
      - { name: sights, label: 景點清單連結, widget: string, required: false, default: '', hint: '可以與美食共用同一個連結，前台會標示綜合清單。' }
      - { name: image, label: 封面照片, widget: image, required: false, default: '', choose_url: false, hint: '上傳有權使用的 JPG、PNG、WebP 或 GIF；留空使用預設封面；儲存後可用上方「推薦收件箱／搜圖」自動搜尋候選。' }
      - { name: imageAlt, label: 圖片描述, widget: string, required: false, default: '' }
      - { name: imageAltHans, label: 图片描述（简体中文）, widget: string, required: false, default: '' }
      - { name: imageAltJa, label: 圖片描述（日本語）, widget: string, required: false, default: '' }
      - { name: imageAltKo, label: 圖片描述（한국어）, widget: string, required: false, default: '' }
      - { name: imageAltEn, label: Image description (English), widget: string, required: false, default: '' }
      - { name: imageCredit, label: 攝影者與授權, widget: string, required: false, default: '' }
      - { name: imageSource, label: 原圖來源網址, widget: string, required: false, default: '' }
      - { name: imageLicense, label: 授權條款網址, widget: string, required: false, default: '' }
      - { name: order, label: 顯示順序, widget: number, value_type: int, default: 10, min: 0 }
      - { name: published, label: 公開顯示, widget: boolean, default: true, hint: '關閉即可暫時下架，不用刪除清單。' }
      - { name: myMap, label: Google 我的地圖, widget: string, required: false, default: '', hint: '貼上完整的 https://www.google.com/maps/d/viewer?mid=... 網址。地圖須開放公開瀏覽才能嵌入；不用貼 iframe。' }
      - { name: article, label: 旅行筆記（繁體中文）, widget: text, required: false, default: '', hint: '以空行分段，適合行程、交通與旅行心得；前台會建立可分享的城市文章頁。' }
      - { name: articleHans, label: 旅行笔记（简体中文）, widget: text, required: false, default: '' }
      - { name: articleJa, label: 旅行筆記（日本語）, widget: text, required: false, default: '' }
      - { name: articleKo, label: 旅行筆記（한국어）, widget: text, required: false, default: '' }
      - { name: articleEn, label: Travel notes (English), widget: text, required: false, default: '' }

  - name: themes
    label: 主題精選
    label_singular: 主題精選
    folder: content/themes
    create: true
    delete: false
    extension: json
    format: json
