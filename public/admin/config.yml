      - { name: link, label: 主題清單連結, widget: string, required: false, default: '', hint: '支援 Google Maps、Apple Maps、高德、百度 HTTPS 分享連結。留空顯示整理中。' }
      - { name: amap, label: 高德地圖分享連結, widget: string, required: false, default: '', hint: '貼上高德的 HTTPS 分享連結；不會自動轉換 Google 清單。' }
      - { name: baidu, label: 百度地圖分享連結, widget: string, required: false, default: '', hint: '貼上百度地圖的 HTTPS 分享連結。' }

      - { name: myMap, label: Google 我的地圖, widget: string, required: false, default: '', hint: '貼上完整的 https://www.google.com/maps/d/viewer?mid=... 網址。地圖須開放公開瀏覽才能嵌入；不用貼 iframe。' }
      - { name: article, label: 遊記（繁體中文）, widget: text, required: false, default: '', hint: '以空行分段，適合行程、交通與旅行心得；前台會建立可分享的主題文章頁。' }
      - { name: articleHans, label: 游记（简体中文）, widget: text, required: false, default: '' }
      - { name: articleJa, label: 遊記（日本語）, widget: text, required: false, default: '' }
      - { name: articleKo, label: 遊記（한국어）, widget: text, required: false, default: '' }
      - { name: articleEn, label: Travel notes (English), widget: text, required: false, default: '' }
  - name: creators
    label: 編輯部作者資料
    folder: content/creators
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: name
    slug: '{{id}}'
    fields:
      - { name: id, label: 固定識別碼, widget: stable-id }
      - { name: name, label: 名稱, widget: string }
      - { name: english, label: 英文名稱, widget: string, required: false }
      - { name: aliases, label: 搜尋別名, widget: list, required: false }
      - { name: description, label: 簡介, widget: text, required: false }
      - { name: published, label: 公開顯示, widget: boolean, default: true }
      - { name: order, label: 排序, widget: number, default: 10 }

  - name: homepage
    label: 首頁版面設定
    files:
      - name: home
        label: 首頁主圖與目的地入口
        file: content/site.json
        fields:
          - { name: featured, label: 保留的精選識別碼, widget: list, required: false }
          - name: home
            label: 首頁呈現
            widget: object
            fields:
              - { name: heroList, label: 首頁主圖清單, widget: hero-list, default: 'cities/hualien', hint: '按名稱選擇已發布且有封面的城市或主題清單，毋須填寫識別碼。' }
              - name: destinations
                label: 下一站目的地（可拖曳排序）
                widget: relation
                collection: countries
                search_fields: [name, id]
                value_field: id
                display_fields: [name]
                multiple: true
                required: false
              - { name: title, label: '大標題（繁體中文）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
              - { name: description, label: '副標題（繁體中文）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
              - { name: titleHans, label: '大標題（简体中文）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
              - { name: descriptionHans, label: '副標題（简体中文）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
              - { name: titleEn, label: '大標題（English）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
              - { name: descriptionEn, label: '副標題（English）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
              - { name: titleJa, label: '大標題（日本語）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
              - { name: descriptionJa, label: '副標題（日本語）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
              - { name: titleKo, label: '大標題（한국어）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
              - { name: descriptionKo, label: '副標題（한국어）', widget: text, required: false, hint: '留空使用預設文案；可換行。' }
