      - { name: sources, label: 來源創作者, widget: relation, collection: creators, search_fields: [name], value_field: id, display_fields: [name], multiple: true, required: false }
      - { name: destinations, label: 地名標籤：國家／地區, widget: relation, collection: countries, search_fields: [name], value_field: id, display_fields: [name], multiple: true, required: false }
      - { name: locationNames, label: 地名標籤：補充地名, widget: list, required: false, hint: '例如墾丁、可愛島；未建立國家／城市資料時也可填寫，點選可篩選同地名清單。' }
      - { name: tags, label: 類別標籤, widget: list, required: false }
      - { name: keywords, label: 搜尋關鍵字與別名, widget: list, required: false }
      - name: videos
        label: YouTube 原影片（上下排列）
        widget: list
        required: false
        fields:
          - { name: url, label: YouTube 網址, widget: string }
          - { name: title, label: 影片標題, widget: string, required: false }
          - { name: start, label: 起播秒數, widget: number, value_type: int, min: 0, default: 0 }
      - name: places
        label: 已確認收錄的景點
        widget: list
        required: false
        fields:
          - { name: name, label: 景點名稱, widget: string }
          - { name: keywords, label: 搜尋別名, widget: list, required: false }
          - { name: url, label: 地圖網址, widget: string, required: false }
          - { name: source, label: 資料來源網址, widget: string, required: false }
          - { name: note, label: 備註, widget: text, required: false }
      - { name: id, label: 固定識別碼, widget: stable-id }
      - { name: name, label: 名稱, widget: string }
      - { name: english, label: 英文名稱, widget: string, required: false, default: '' }
      - { name: nameHans, label: 简体中文名稱, widget: string, required: false, default: '' }
      - { name: nameJa, label: 名稱（日本語）, widget: string, required: false, default: '' }
      - { name: nameKo, label: 名稱（한국어）, widget: string, required: false, default: '' }
      - { name: autoDescription, label: 簡介留空時由 AI 自動產生, widget: boolean, required: false, default: true, hint: '發布時產生並保存繁體中文簡介，再自動翻譯。已有文字不會覆蓋；生成後可重新開啟修改。' }
      - { name: descriptionSource, label: 簡介來源網址, widget: string, required: false }
      - { name: descriptionImportedAt, widget: hidden, required: false }
      - { name: descriptionImportMethod, widget: hidden, required: false }
      - { name: description, label: 簡短介紹, widget: text, required: false, default: '' }
      - { name: descriptionHans, label: 简体中文介紹, widget: text, required: false, default: '' }
      - { name: descriptionJa, label: 介紹（日本語）, widget: text, required: false, default: '' }
      - { name: descriptionKo, label: 介紹（한국어）, widget: text, required: false, default: '' }
      - { name: descriptionEn, label: English introduction, widget: text, required: false, default: '' }
      - { name: image, label: 封面照片, widget: image, required: false, default: '', choose_url: false, hint: '請上傳有權使用的 JPG、PNG、WebP 或 GIF。沒有照片時使用預設封面；儲存後可用上方「推薦收件箱／搜圖」自動搜尋候選。' }
      - { name: imageAlt, label: 圖片描述, widget: string, required: false, default: '', hint: '有封面照片時必填，供無法看見圖片的人理解內容。' }
