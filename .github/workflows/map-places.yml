name: Save map places
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: map-places-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse queued public Google lists and save snapshots
        env:
          MAP_PLACES_SYNC_KEY: ${{ secrets.MAP_PLACES_SYNC_KEY }}
        run: node scripts/sync-saved-places.mjs
